---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: owncloud-credentials
  namespace: owncloud
spec:
  encryptedData:
    OWNCLOUD_ADMIN_PASSWORD: 
    OWNCLOUD_ADMIN_USERNAME: 
    OWNCLOUD_DB_PASSWORD: 
    OWNCLOUD_DB_USERNAME: 
    OWNCLOUD_DOMAIN: 
    OWNCLOUD_TRUSTED_DOMAINS: 
  template:
    metadata:
      name: owncloud-credentials
      namespace: owncloud
