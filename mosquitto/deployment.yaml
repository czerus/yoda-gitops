apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      initContainers:
        - name: create-passwd
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "$(cat /tmp/passwd-secret/passwd)" > /mosquitto/config/passwd
              chown 1000:1000 /mosquitto/config/passwd
              chmod 0700 /mosquitto/config/passwd
              cp /tmp/mosquitto.conf /mosquitto/config/mosquitto.conf
              chown 1000:1000 /mosquitto/config/mosquitto.conf
          volumeMounts:
            - mountPath: /tmp/passwd-secret
              name: passwd-secret
            - mountPath: /tmp/mosquitto.conf
              name: config
              subPath: mosquitto.conf
            - mountPath: /mosquitto/config
              name: config-writable

      containers:
        - name: mosquitto
          image: eclipse-mosquitto:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Europe/Warsaw"
          volumeMounts:
            - mountPath: /mosquitto/config
              name: config-writable
            - mountPath: /mosquitto/data
              name: data
            - mountPath: /mosquitto/log
              name: log
          ports:
            - containerPort: 1883

      volumes:
        - name: passwd-secret
          secret:
            secretName: mosquitto-passwd
        - name: config-writable
          emptyDir: {}
        - name: config
          configMap:
            name: mosquitto-config
        - name: log
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/mosquitto/log
        - name: data
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/mosquitto/data