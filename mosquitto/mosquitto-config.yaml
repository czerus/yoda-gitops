apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |
    log_dest stdout
    persistence true
    persistence_location /mosquitto/data/
    listener 1883
    protocol mqtt
    listener 9001
    protocol websockets
    allow_anonymous false
    password_file /mosquitto/config/passwd
