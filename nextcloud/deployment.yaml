apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  revisionHistoryLimit: 0 
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      volumes:
        - name: config
          hostPath: 
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/nextcloud
        - name: data
          hostPath: 
            path: /srv/mergerfs/mergefs/nextcloud  
      containers:
        - name: nextcloud
          image: lscr.io/linuxserver/nextcloud:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Europe/Warsaw"
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data/
              name: data
          ports:
              - containerPort: 443
