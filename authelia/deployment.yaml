apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec: 
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: config
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/authelia         
      containers:
        - name: authelia
          image: docker.io/authelia/authelia:latest
          imagePullPolicy: Always
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: JWT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: SESSION_SECRET
            - name: STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: STORAGE_PASSWORD
            - name: STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: STORAGE_ENCRYPTION_KEY
          volumeMounts:
            - mountPath: /config
              name: config
          ports:
              - containerPort: 9091
                name: main
