apiVersion: apps/v1
kind: Deployment
metadata:
  name: droppedneedle
spec:
  revisionHistoryLimit: 0 
  replicas: 1
  selector:
    matchLabels:
      app: droppedneedle
  template:
    metadata:
      labels:
        app: droppedneedle
    spec:
      volumes:
        - name: music
          hostPath: 
            path: /srv/mergerfs/mergefs/data/media/music
        - name: slskd-downloads
          hostPath: 
            path: /srv/mergerfs/mergefs/data/slskd
        - name: config
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/droppedneedle/config  
        - name: cache
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/droppedneedle/cache  
        - name: plugins
          hostPath:
            path: /srv/dev-disk-by-uuid-f0d9ee2e-5550-4e41-897d-9b8d2d01c681/pod_config/droppedneedle/plugins    
      containers:
        - name: droppedneedle
          image: ghcr.io/habirabbu/droppedneedle:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Europe/Warsaw"
            - name: SLSKD_DOWNLOADS_PATH
              value: "/slskd-downloads"
          volumeMounts:
            - mountPath: /app/config
              name: config
            - mountPath: /app/cache
              name: cache
            - mountPath: /app/plugins
              name: plugins
            - mountPath: /music
              name: music
            - mountPath: /slskd-downloads
              name: slskd-downloads
          ports:
              - containerPort: 8688
